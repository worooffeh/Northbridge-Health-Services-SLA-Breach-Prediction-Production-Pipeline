[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northbridge-sla-breach"
version = "0.1.0"
description = "Leakage-aware SLA breach prediction and predictive process monitoring"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["notebooks"]
